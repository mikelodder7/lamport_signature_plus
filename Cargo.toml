[package]
authors = ["Michael Lodder <redmike7@gmail.com>"]
autobenches = false
description = "An implementation of the Lamport one-time signature scheme."
documentation = "https://docs.rs/lamport_signature_plus"
edition = "2024"
keywords = ["lamport", "signature", "crypto", "cryptography"]
license = "MIT/Apache-2.0"
name = "lamport_signature_plus"
readme = "README.md"
repository = "https://github.com/mikelodder7/lamport_signature_plus"
version = "0.5.0-rc2"

[dependencies]
digest = "0.11.3"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
rand_core = "0.10"
serde = { version = "1.0", default-features = false, features = ["std"] }
subtle = { version = "2.6", default-features = false }
thiserror = "2.0"
vsss-rs = { version = "6.0.0-rc8", default-features = false, features = ["alloc"] }
zeroize = "1"

[dev-dependencies]
criterion = "0.8"
postcard = { version = "1.0", features = ["use-std"] }
rand = "0.10"
rand_chacha = "0.10"
serde_json = "1.0"
sha2 = "0.11"
sha3 = "0.12"
shake = "0.1"
blake2 = "0.11.0-rc.6"
whirlpool = "0.11"

[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unsafe_code = "deny"
unstable_features = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }
unused_import_braces = "deny"
unused_parens = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_extern_crates = "deny"

[lints.clippy]
unwrap_used = "deny"
cast_precision_loss = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
mod_module_files = "warn"
panic = "warn"
panic_in_result_fn = "warn"

[[bench]]
name = "blake2"
harness = false

[[bench]]
name = "sha2"
harness = false

[[bench]]
name = "sha3"
harness = false

[[bench]]
name = "whirlpool"
harness = false
